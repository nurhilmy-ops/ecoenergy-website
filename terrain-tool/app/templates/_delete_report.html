<details class="danger">
  <summary>Delete this report now</summary>
  <p class="small muted">This permanently deletes your uploaded site file, the maps and the PDF/Word reports. It can't be undone.</p>
  <form method="post" action="/reports/{{ job.id }}/delete">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <button class="btn-danger" type="submit">Yes, delete it permanently</button>
  </form>
</details>
