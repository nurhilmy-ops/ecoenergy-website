// Installed by the terrain tool setup (deploy/aws-lightsail/setup.sh) as
// /etc/apt/apt.conf.d/52terrain-tool-upgrades.
// Install Ubuntu security updates every day by themselves.
APT::Periodic::Update-Package-Lists "1";
APT::Periodic::Unattended-Upgrade "1";
APT::Periodic::AutocleanInterval "7";
// When an update needs a restart (for example a new Linux kernel), restart at 19:30 server
// time (the server clock is UTC), which is 03:30 in Malaysia. The tool is back within a minute.
Unattended-Upgrade::Automatic-Reboot "true";
Unattended-Upgrade::Automatic-Reboot-Time "19:30";
