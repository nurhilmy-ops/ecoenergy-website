// Installed by the terrain tool setup (deploy/aws-lightsail/setup.sh) as
// /etc/apt/apt.conf.d/52terrain-tool-upgrades.
// Install Ubuntu security updates every day by themselves.
APT::Periodic::Update-Package-Lists "1";
APT::Periodic::Unattended-Upgrade "1";
APT::Periodic::AutocleanInterval "7";
// Also update Caddy (the HTTPS web server, from Caddy's own apt repository, whose Release file
// says "Origin: cloudsmith/caddy/stable"). Its package restarts Caddy; certificates are kept.
Unattended-Upgrade::Origins-Pattern:: "origin=cloudsmith/caddy/stable";
// When an update needs a restart (for example a new Linux kernel), restart at 20:00 server
// time (the server clock is UTC), which is 04:00 in Malaysia: after the nightly backup (02:30)
// and the Lightsail snapshot (03:00, which can take until about 03:45). The tool is back within
// a minute.
Unattended-Upgrade::Automatic-Reboot "true";
Unattended-Upgrade::Automatic-Reboot-Time "20:00";
