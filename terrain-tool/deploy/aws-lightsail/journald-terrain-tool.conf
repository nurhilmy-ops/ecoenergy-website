# Installed by setup.sh as /etc/systemd/journald.conf.d/terrain-tool.conf:
# keep the system log small on a 60 GB disk, and no older than about 30 days.
[Journal]
SystemMaxUse=500M
MaxRetentionSec=30day
# Start a new journal file every day, so that whole files (and with them every entry older than
# 30 days) can be deleted on time: by default a file covers a month.
MaxFileSec=1day
# Do not pass messages on to rsyslog (/var/log/syslog, kept about 5 weeks by logrotate), so the
# limits above are the only ones for the tool's logs, which can quote a visitor's email address.
ForwardToSyslog=no
