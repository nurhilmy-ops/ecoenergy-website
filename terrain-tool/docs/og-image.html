<!DOCTYPE html>
<!-- Source for app/static/og-image.png (1200x630 social share image).
     Regenerate with headless Chrome:
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless --hide-scrollbars \
       --window-size=1200,630 --virtual-time-budget=5000 \
       --screenshot=app/static/og-image.png docs/og-image.html -->
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,400&family=Hanken+Grotesk:wght@400;500&family=Spline+Sans+Mono:wght@400;500&display=block" rel="stylesheet">
<style>
:root{--navy:#0F2742;--navy-line:#23425F;--gold:#D4A23A;--gold-deep:#B8841F;--paper:#F4EFE6;--cloud:#AFBFCF;--cloud-dim:#7E93A8}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden;background:var(--navy)}
body{position:relative;padding:64px 72px;font-family:'Hanken Grotesk',sans-serif;color:var(--paper)}
.contours{position:absolute;inset:0;width:100%;height:100%}
.brand{position:relative;display:flex;align-items:center;gap:14px}
.brand img{width:44px;height:44px}
.brand .name{font-family:'Fraunces',serif;font-size:28px;letter-spacing:-.01em}
.brand .name b{color:var(--gold);font-weight:400}
.brand .sub{font-family:'Spline Sans Mono',monospace;font-size:12px;letter-spacing:.32em;color:var(--cloud-dim);text-transform:uppercase}
.kicker{position:relative;margin-top:54px;font-family:'Spline Sans Mono',monospace;font-size:17px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
h1{position:relative;margin-top:18px;max-width:15ch;font-family:'Fraunces',serif;font-weight:400;font-size:68px;line-height:1.06;letter-spacing:-.02em}
h1 em{color:var(--gold)}
.classes{position:absolute;right:72px;top:64px;width:300px;display:flex;flex-direction:column;gap:10px}
.cls{display:flex;align-items:center;gap:16px;height:62px;padding:0 20px;border:1px solid var(--navy-line);font-family:'Spline Sans Mono',monospace}
.cls .k{font-size:22px;width:52px}
.cls .v{font-size:17px;color:var(--cloud)}
.c1{background:#132E4D}.c2{background:#3A5170}.c3{background:var(--gold-deep)}.c4{background:var(--gold)}
.c3 .k,.c4 .k,.c3 .v,.c4 .v{color:var(--navy)}
.cap{font-family:'Spline Sans Mono',monospace;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--cloud-dim);text-align:right;margin-top:4px}
.foot{position:absolute;left:72px;right:72px;bottom:56px;display:flex;justify-content:space-between;align-items:flex-end;border-top:1px solid rgba(212,162,58,.3);padding-top:22px}
.url{font-family:'Spline Sans Mono',monospace;font-size:32px;color:var(--paper)}
.note{font-size:18px;color:var(--cloud)}
</style>
</head>
<body>
<svg class="contours" viewBox="0 0 1200 630" preserveAspectRatio="none" aria-hidden="true">
  <g fill="none" stroke="#23425F" stroke-width="1">
    <path d="M-20,560 C200,510 330,590 540,540 S900,460 1220,500"/>
    <path d="M-20,500 C220,450 360,530 570,480 S920,390 1220,430"/>
    <path d="M-20,440 C240,390 390,470 600,420 S940,320 1220,360"/>
  </g>
</svg>
<div class="brand">
  <img src="../app/static/logo-mark.svg" alt="">
  <div><div class="name">Eco<b>Energy</b></div><div class="sub">Consultancy</div></div>
</div>
<p class="kicker">Free desktop tool · Malaysia</p>
<h1>Know your site's terrain <em>before</em> you commit.</h1>
<div class="classes">
  <div class="cls c1"><span class="k">I</span><span class="v">under 15°</span></div>
  <div class="cls c2"><span class="k">II</span><span class="v">15–25°</span></div>
  <div class="cls c3"><span class="k">III</span><span class="v">25–35°</span></div>
  <div class="cls c4"><span class="k">IV</span><span class="v">over 35°</span></div>
  <div class="cap">KPKT slope classes, by angle</div>
</div>
<div class="foot">
  <span class="url">tools.ecoconsultancy.services</span>
  <span class="note">Upload a KML or KMZ · report in minutes</span>
</div>
</body>
</html>
